name: Cursor Fix (Write Access)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  check-permissions:
    if: |
      (
        github.event_name == 'issue_comment' ||
        github.event_name == 'pull_request_review_comment'
      ) &&
      contains(github.event.comment.body, '@claude-review')
    runs-on: ubuntu-latest
    outputs:
      has-permission: ${{ steps.check.outputs.has-permission }}
    steps:
      - name: Check if user has write permission
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });
              const hasPermission = ['admin', 'write'].includes(permission.permission);
              core.setOutput('has-permission', hasPermission);
              return hasPermission;
            } catch (error) {
              core.setOutput('has-permission', false);
              return false;
            }

  cursor-fix:
    needs: check-permissions
    # Only trigger on @cursor-fix command from users with write access
    if: |
      (
        github.event_name == 'issue_comment' ||
        github.event_name == 'pull_request_review_comment'
      ) &&
      contains(github.event.comment.body, '@cursor-fix') &&
      needs.check-permissions.outputs.has-permission == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write # Allow creating branches and editing files
      pull-requests: write # Allow creating and updating pull requests
      issues: write # Allow commenting on and updating issues
      id-token: write # Required for OIDC authentication
      actions: read # Read CI results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better context

      - name: Configure Git
        run: |
          git config user.name "cursor-bot"
          git config user.email "cursor-bot@users.noreply.github.com"

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Load fix instructions
        id: load-instructions
        run: |
          # Get the issue or PR number from the event
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          else
            ISSUE_NUMBER="${{ github.event.pull_request.number }}"
          fi

          # Read the template and replace placeholders
          INSTRUCTIONS=$(cat .github/issue_fix_prompt.md | sed 's/{AI_ASSISTANT}/cursor/g')

          # Prepend context
          echo "# GitHub Context" > /tmp/cursor_fix_prompt.txt
          echo "- Repository: ${{ github.repository }}" >> /tmp/cursor_fix_prompt.txt
          echo "- Issue/PR Number: ${ISSUE_NUMBER}" >> /tmp/cursor_fix_prompt.txt
          echo "- Triggered by: ${{ github.event.comment.user.login }}" >> /tmp/cursor_fix_prompt.txt
          echo "" >> /tmp/cursor_fix_prompt.txt
          echo "$INSTRUCTIONS" >> /tmp/cursor_fix_prompt.txt

      - name: Run Cursor Fix
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run cursor-agent with the fix instructions and full write permissions
          cursor-agent -p "$(cat /tmp/cursor_fix_prompt.txt)" --model gpt-5 --force

  unauthorized-message:
    needs: check-permissions
    # Post message for unauthorized users
    if: |
      (
        github.event_name == 'issue_comment' ||
        github.event_name == 'pull_request_review_comment'
      ) &&
      contains(github.event.comment.body, '@cursor-fix') &&
      needs.check-permissions.outputs.has-permission == 'false'

    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Post unauthorized message
        uses: actions/github-script@v7
        with:
          script: |
            const comment = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ @${context.actor} - You are not authorized to trigger Cursor fix.\n\nOnly repository contributors with write access can trigger Cursor fix. Please ask a maintainer for review.`
            };

            if (context.eventName === 'issue_comment') {
              await github.rest.issues.createComment({
                ...comment,
                issue_number: context.issue.number
              });
            } else if (context.eventName === 'pull_request_review_comment') {
              await github.rest.pulls.createReplyForReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                comment_id: context.payload.comment.id,
                body: comment.body
              });
            }